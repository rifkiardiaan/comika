  webview_flutter_wkwebview: ^3.26.1
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
