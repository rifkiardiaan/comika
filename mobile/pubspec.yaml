name: comika_mobile
description: "COMIKA — Aplikasi mobile platform komik dan webtoon digital."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.1.0
  webview_flutter_wkwebview: ^3.26.1
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/comika-logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/comika-logo.jpeg"
  # Web favicon
  web:
    generate: true
    image_path: "assets/comika-logo.jpeg"
    background_color: "#FFFFFF"
    theme_color: "#2563EB"

flutter:
  uses-material-design: true
  assets:
    - assets/comika-logo.jpeg
